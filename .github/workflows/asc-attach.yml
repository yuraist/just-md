name: Attach build to App Store version

on:
  push:
    branches: [master, 'release/**']
    paths-ignore: ['docs/**', '**.md', 'marketing/**']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: asc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Write ASC key
        run: echo "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Attach newest build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 scripts/asc-release.py attach --commit "$GITHUB_SHA"
          else
            python3 scripts/asc-release.py attach
          fi
